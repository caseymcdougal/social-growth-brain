<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Social Audit Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var key = "social-audit-dashboard-state-v1";
        try {
          var cached = window.localStorage.getItem(key);
          if (cached) {
            window.__socialAuditDashboardState = JSON.parse(cached);
            window.__socialAuditDashboardStateSource = "storage";
            return;
          }
        } catch (error) {}

        window.__socialAuditDashboardStatePromise = fetch("/api/dashboard").then(function (response) {
          if (!response.ok) throw new Error("Failed to load latest snapshot");
          return response.json().then(function (data) {
            window.__socialAuditDashboardState = data;
            window.__socialAuditDashboardStateSource = "network";
            return data;
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
